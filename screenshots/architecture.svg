<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#111"/>
    </marker>
    <marker id="ahs" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#111"/>
    </marker>
    <marker id="ahd" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#666"/>
    </marker>
    <marker id="ahstart" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M10,0 L0,4 L10,8 z" fill="#111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="790" fill="#ffffff"/>

  <!-- ================= Web Browser ================= -->
  <rect x="25" y="15" width="950" height="315" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="500" y="40" text-anchor="middle" font-size="17">Web Browser</text>

  <!-- Metamodeling Client -->
  <rect x="50" y="55" width="430" height="255" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <text x="265" y="82" text-anchor="middle" font-size="17">Metamodeling Client</text>
  <text x="265" y="101" text-anchor="middle" font-size="10.5" fill="#333">React · Vite · MUI · Zustand · :8075</text>
  <rect x="70" y="114" width="390" height="36" fill="#f7f7f7" stroke="#555"/>
  <text x="265" y="137" text-anchor="middle" font-size="12.5">React SPA · Zustand Stores</text>
  <rect x="70" y="158" width="190" height="36" fill="#f7f7f7" stroke="#555"/>
  <text x="165" y="181" text-anchor="middle" font-size="12.5">VizRep Editor (Monaco)</text>
  <rect x="270" y="158" width="190" height="36" fill="#f7f7f7" stroke="#555"/>
  <text x="365" y="181" text-anchor="middle" font-size="12.5">THREE.js Preview</text>
  <rect x="70" y="202" width="390" height="36" fill="#f7f7f7" stroke="#555"/>
  <text x="265" y="225" text-anchor="middle" font-size="12.5">Metamodel Design · Rights · Rules</text>


  <!-- Modeling Client -->
  <rect x="520" y="55" width="430" height="255" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <text x="735" y="82" text-anchor="middle" font-size="17">Modeling Client</text>
  <text x="735" y="101" text-anchor="middle" font-size="10.5" fill="#333">React · Vite · MUI · Zustand · :8085</text>
  <rect x="540" y="114" width="390" height="36" fill="#f7f7f7" stroke="#555"/>
  <text x="735" y="137" text-anchor="middle" font-size="12.5">React SPA · Zustand Stores</text>
  <rect x="540" y="158" width="190" height="36" fill="#f7f7f7" stroke="#555"/>
  <text x="635" y="181" text-anchor="middle" font-size="12.5">THREE.js Canvas</text>
  <rect x="740" y="158" width="190" height="36" fill="#f7f7f7" stroke="#555"/>
  <text x="835" y="181" text-anchor="middle" font-size="12.5">Interaction · WebXR</text>
  <rect x="540" y="202" width="190" height="36" fill="#f7f7f7" stroke="#555"/>
  <text x="635" y="225" text-anchor="middle" font-size="12.5">State Controller</text>
  <rect x="740" y="202" width="190" height="36" fill="#dce9f5" stroke="#555"/>
  <text x="835" y="225" text-anchor="middle" font-size="12.5">Yjs Collaboration</text>



  <!-- ================= API Server ================= -->
  <rect x="50" y="400" width="300" height="200" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <text x="200" y="428" text-anchor="middle" font-size="17">API Server</text>
  <text x="200" y="447" text-anchor="middle" font-size="10.5" fill="#333">Node.js · Express · :8000</text>
  <rect x="68" y="458" width="130" height="32" fill="#f7f7f7" stroke="#555"/>
  <text x="133" y="479" text-anchor="middle" font-size="12">Routes</text>
  <rect x="208" y="458" width="130" height="32" fill="#f7f7f7" stroke="#555"/>
  <text x="273" y="479" text-anchor="middle" font-size="12">Controller</text>
  <rect x="68" y="498" width="130" height="32" fill="#f7f7f7" stroke="#555"/>
  <text x="133" y="519" text-anchor="middle" font-size="12">Connection</text>
  <rect x="208" y="498" width="130" height="32" fill="#f7f7f7" stroke="#555"/>
  <text x="273" y="519" text-anchor="middle" font-size="12">Rule Checker</text>
  <rect x="68" y="538" width="270" height="32" fill="#dce9f5" stroke="#555"/>
  <text x="203" y="559" text-anchor="middle" font-size="12">Authentication · Scene Access Control</text>

  <!-- Database -->
  <path d="M110,650 a90,16 0 0 1 180,0 v40 a90,16 0 0 1 -180,0 z" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <ellipse cx="200" cy="650" rx="90" ry="16" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
  <text x="200" y="683" text-anchor="middle" font-size="13">Database · PostgreSQL</text>

  <!-- ================= Sync Server ================= -->
  <rect x="400" y="400" width="200" height="160" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <text x="500" y="428" text-anchor="middle" font-size="16">Sync Server</text>
  <text x="500" y="446" text-anchor="middle" font-size="10" fill="#333">Node.js · Yjs · ws · :8060</text>
  <rect x="418" y="458" width="164" height="32" fill="#dce9f5" stroke="#555"/>
  <text x="500" y="479" text-anchor="middle" font-size="11.5">Yjs Room per Scene</text>
  <rect x="418" y="498" width="164" height="32" fill="#dce9f5" stroke="#555"/>
  <text x="500" y="519" text-anchor="middle" font-size="11.5">JWT · Access Gating</text>

  <!-- ================= Global Shared Datastructure ================= -->
  <rect x="650" y="400" width="300" height="200" fill="#d9d9d9" stroke="#111" stroke-width="2"/>
  <text x="800" y="428" text-anchor="middle" font-size="15.5">Global Shared Datastructure</text>
  <text x="800" y="446" text-anchor="middle" font-size="10" fill="#333">TypeScript class definitions</text>
  <rect x="668" y="458" width="264" height="32" fill="#f7f7f7" stroke="#555"/>
  <text x="800" y="479" text-anchor="middle" font-size="12">Meta Classes</text>
  <rect x="668" y="498" width="264" height="32" fill="#f7f7f7" stroke="#555"/>
  <text x="800" y="519" text-anchor="middle" font-size="12">Instance Classes</text>
  <rect x="668" y="538" width="264" height="32" fill="#f7f7f7" stroke="#555"/>
  <text x="800" y="559" text-anchor="middle" font-size="12">Helper Classes</text>

  <!-- ================= Arrows ================= -->
  <!-- Metamodeling Client <-> API : REST -->
  <path d="M150,332 L150,398" stroke="#111" stroke-width="3" fill="none" marker-end="url(#ah)" marker-start="url(#ahstart)"/>
  <text x="158" y="368" font-size="12">REST</text>

  <!-- Modeling Client <-> API : REST -->
  <path d="M560,332 L560,356 L250,356 L250,398" stroke="#111" stroke-width="3" fill="none" marker-end="url(#ah)" marker-start="url(#ahstart)"/>
  <text x="380" y="350" font-size="12">REST</text>

  <!-- Modeling Client <-> Sync : WebSocket -->
  <path d="M700,332 L700,380 L500,380 L500,398" stroke="#111" stroke-width="3" fill="none" marker-end="url(#ah)" marker-start="url(#ahstart)"/>
  <text x="560" y="374" font-size="12">WebSocket · real-time sync</text>

  <!-- Sync -> API : access check -->
  <path d="M398,470 L352,470" stroke="#111" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <text x="375" y="461" text-anchor="middle" font-size="11">access</text>
  <text x="375" y="491" text-anchor="middle" font-size="11">check</text>

  <!-- API <-> Database -->
  <path d="M200,604 L200,630" stroke="#111" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <text x="212" y="623" font-size="11">SQL</text>

  <!-- GDS -> API : import -->
  <path d="M648,585 L352,585" stroke="#666" stroke-width="3" stroke-dasharray="9 6" fill="none" marker-end="url(#ahd)"/>
  <text x="500" y="602" text-anchor="middle" font-size="12" fill="#444">import</text>

  <!-- GDS -> browser (both clients) : import -->
  <path d="M880,398 L880,332" stroke="#666" stroke-width="3" stroke-dasharray="9 6" fill="none" marker-end="url(#ahd)"/>
  <text x="890" y="368" font-size="12" fill="#444">import</text>

  <!-- ================= Legend ================= -->
  <line x1="50" y1="730" x2="100" y2="730" stroke="#111" stroke-width="3"/>
  <text x="108" y="734" font-size="12">runtime communication</text>
  <line x1="270" y1="730" x2="320" y2="730" stroke="#666" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="328" y="734" font-size="12" fill="#444">import / dependency</text>
  <rect x="500" y="722" width="16" height="16" fill="#dce9f5" stroke="#555"/>
  <text x="524" y="734" font-size="12">added for real-time collaboration</text>
</svg>
